name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_SDL_DEPS: >-
    ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl-dev libgl-dev libdrm-dev
    libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_SDL_DEPS

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  # Every platform's export of an empty game must build and run headless.
  export:
    name: Export (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
          - platform: web
            os: ubuntu-24.04
          - platform: android
            os: ubuntu-24.04
    env:
      EMSDK_VERSION: 6.0.10
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_SDL_DEPS

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Emscripten
        if: matrix.platform == 'web'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Build slash-cli
        run: |
          cmake --preset release
          cmake --build --preset release --target slash-cli

      - name: Export an empty game and run it headless
        shell: bash
        run: |
          cli=./build/release/tools/slash-cli/slash-cli
          $cli init build/empty-game
          $cli export ${{ matrix.platform }} --project build/empty-game --test

      - name: Check the signature and minimum macOS
        if: matrix.platform == 'macos'
        run: |
          app=$(ls -d build/empty-game/build/export/macos/*.app)
          codesign --verify --strict --verbose=2 "$app"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "11.0"

      - name: Check the minimum Windows version and sign with a preset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/empty-game/build/export/windows/*.exe)[0].FullName
          $headers = dumpbin /headers $exe
          if (-not ($headers -match '10\.00 subsystem version')) { $headers; exit 1 }
          # A throwaway certificate, exported the way a developer would hand one over.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=SlashEngine CI' `
            -CertStoreLocation Cert:\CurrentUser\My
          $password = ConvertTo-SecureString -String 'ci-only' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ci.pfx" -Password $password
          $env:SLASH_WINDOWS_CERTIFICATE_PATH = "$env:RUNNER_TEMP\ci.pfx"
          $env:SLASH_WINDOWS_CERTIFICATE_PASSWORD = 'ci-only'
          Set-Content build/empty-game/export_presets.json `
            '{"format": 1, "presets": {"windows": {"platform": "windows", "windows": {"sign": true, "timestamp_url": ""}}}}'
          ./build/release/tools/slash-cli/slash-cli export windows --project build/empty-game
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $signature = Get-AuthenticodeSignature $exe
          if ($null -eq $signature.SignerCertificate) { $signature | Format-List; exit 1 }

      - name: Check the APK and sign it with a release key
        if: matrix.platform == 'android'
        run: |
          cli=./build/release/tools/slash-cli/slash-cli
          apk=$(ls build/empty-game/build/export/android/*.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | grep -E '/[0-9.]+/$' | sort -V | tail -n 1)
          "$tools/zipalign" -c -P 16 4 "$apk"
          badging=$("$tools/aapt2" dump badging "$apk")
          grep -q "sdkVersion:'30'" <<< "$badging"
          grep -q "targetSdkVersion:'36'" <<< "$badging"
          grep -q "native-code:.*'arm64-v8a'" <<< "$badging"
          grep -q "native-code:.*'x86_64'" <<< "$badging"
          "$tools/apksigner" verify --min-sdk-version 30 "$apk"
          # A throwaway release keystore, passed the way a developer would.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.jks" -storepass ci-only \
            -alias game -keypass ci-only -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=SlashEngine CI"
          SLASH_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" \
            SLASH_ANDROID_KEYSTORE_PASSWORD=ci-only SLASH_ANDROID_KEY_ALIAS=game \
            $cli export android --project build/empty-game
          "$tools/apksigner" verify --print-certs "$apk" | grep -q "CN=SlashEngine CI"

      - name: Enable KVM for the Android emulator
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the APK headless on an Android 11 emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./build/release/tools/slash-cli/slash-cli export android --project build/empty-game --test > build/android-test.json
            cat build/android-test.json
            jq -e '.test.passed == true' build/android-test.json

      - name: Upload the export log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-log-${{ matrix.platform }}
          path: build/empty-game/.slash/export/${{ matrix.platform }}/export.log
          if-no-files-found: ignore

  lint:
    name: Format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-lint-${{ hashFiles('cmake/Dependencies.cmake') }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 $LINUX_SDL_DEPS

      - name: Check formatting
        run: |
          find engine tools tests -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format-18 --dry-run --Werror

      - name: Configure for clang-tidy
        run: cmake --preset ci -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18

      - name: Run clang-tidy
        run: find engine tools -name '*.cpp' | xargs clang-tidy-18 -p build/ci --quiet
