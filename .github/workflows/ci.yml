name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  LINUX_SDL_DEPS: >-
    ninja-build libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxfixes-dev libxi-dev
    libxss-dev libxtst-dev libxkbcommon-dev libwayland-dev libegl-dev libgl-dev libdrm-dev
    libgbm-dev libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

jobs:
  build:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-24.04
          - name: Windows
            os: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/dependencies.json') }}

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      # Mesa's software Vulkan (lavapipe) and OpenGL ES (llvmpipe) let the renderer's GPU tests
      # run with no GPU, so a broken GPU or OpenGL ES path fails here instead of being skipped.
      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update && sudo apt-get install -y $LINUX_SDL_DEPS mesa-vulkan-drivers \
            libgles2 libegl-mesa0 libgl1-mesa-dri
          echo "SLASH_EXPECT_GPU=1" >> "$GITHUB_ENV"

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake --preset ci

      - name: Build
        run: cmake --build --preset ci

      - name: Test
        run: ctest --preset ci

  # Every platform's export of an empty game must build and run headless.
  export:
    name: Export (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos
            os: macos-14
          - platform: linux
            os: ubuntu-24.04
          - platform: windows
            os: windows-2022
          - platform: web
            os: ubuntu-24.04
          - platform: android
            os: ubuntu-24.04
          - platform: ios
            os: macos-14
    env:
      EMSDK_VERSION: 6.0.10
      HELLO_APP_ID: ci # the key examples/sdk-package's stand-in SDK reads
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-${{ matrix.os }}-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/dependencies.json') }}

      - name: Cache downloaded toolchains
        if: matrix.platform == 'linux'
        uses: actions/cache@v4
        with:
          path: ~/.slash/toolchains
          key: toolchains-${{ matrix.os }}-${{ hashFiles('tools/exporter/src/toolchains.cpp') }}

      - name: Install tools (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install tools (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $LINUX_SDL_DEPS

      - name: Install tools (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Emscripten
        if: matrix.platform == 'web'
        run: |
          git clone --depth 1 --branch "$EMSDK_VERSION" https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          "$RUNNER_TEMP/emsdk/emsdk" install "$EMSDK_VERSION"
          "$RUNNER_TEMP/emsdk/emsdk" activate "$EMSDK_VERSION"
          echo "EMSDK=$RUNNER_TEMP/emsdk" >> "$GITHUB_ENV"

      - name: Build slash-cli
        run: |
          cmake --preset release
          cmake --build --preset release --target slash-cli

      - name: Export an empty game and run it headless
        shell: bash
        run: |
          cli=./build/release/tools/slash-cli/slash-cli
          $cli init build/empty-game
          # An SDK package built from source with the game's compilers, which the game calls
          # before main, so each export proves packages link, ship and load.
          $cli sdk add examples/sdk-package/sdks/hello --project build/empty-game
          cp .github/scripts/hello-sdk-check.cpp build/empty-game/src/
          if [ "${{ matrix.platform }}" = android ]; then
            # AndroidX from Google's Maven repository, resolved and pinned without Gradle.
            mkdir -p build/empty-game/sdks/androidx
            echo '{"format": 1, "name": "androidx", "version": "1.13.1", "license": "Apache-2.0", "platforms": {"android": {"maven": ["androidx.core:core:1.13.1"]}}}' \
              > build/empty-game/sdks/androidx/sdk.json
            $cli sdk add build/empty-game/sdks/androidx --project build/empty-game
            $cli sdk lock --project build/empty-game
            cat build/empty-game/sdks/androidx/sdk.lock.json
          fi
          $cli export ${{ matrix.platform }} --project build/empty-game --test > build/export.json || { cat build/export.json; exit 1; }
          cat build/export.json
          jq -e '.sdks[0].name == "hello"' build/export.json

      - name: Check the signature and minimum macOS
        if: matrix.platform == 'macos'
        run: |
          app=$(ls -d build/empty-game/build/export/macos/*.app)
          codesign --verify --strict --verbose=2 "$app"
          test "$(plutil -extract LSMinimumSystemVersion raw "$app/Contents/Info.plist")" = "11.0"
          # The SDK's dylib is embedded, universal, and found through @rpath.
          test "$(plutil -extract HelloAppID raw "$app/Contents/Info.plist")" = "ci"
          lipo -archs "$app/Contents/Frameworks/libhello.dylib" | grep -q x86_64
          otool -L "$app/Contents/MacOS/"* | grep -q "@rpath/libhello.dylib"

      - name: Check the glibc the Linux game needs and run it on Ubuntu 20.04
        if: matrix.platform == 'linux'
        run: |
          .github/scripts/check-linux-game.sh build/empty-game/build/export/linux amd64
          # The SDK's library ships beside the game, which finds it through $ORIGIN.
          test -f build/empty-game/build/export/linux/libhello.so
          test -f build/empty-game/build/export/linux/data/licenses/hello/LICENSE.txt

      - name: Check the Simulator app and build an ad hoc .ipa for devices
        if: matrix.platform == 'ios'
        run: |
          app=$(ls -d build/empty-game/build/export/ios/*.app)
          codesign --verify --strict --verbose=2 "$app"
          test "$(plutil -extract MinimumOSVersion raw "$app/Info.plist")" = "14.0"
          test "$(plutil -extract HelloAppID raw "$app/Info.plist")" = "ci"
          binary="$app/$(plutil -extract CFBundleExecutable raw "$app/Info.plist")"
          lipo -archs "$binary" | grep -q x86_64
          lipo -archs "$binary" | grep -q arm64
          # CI has no Apple Developer team, so the device build is signed ad hoc.
          echo '{"format": 1, "presets": {"device": {"platform": "ios", "ios": {"destination": "device", "codesign_identity": "-"}}}}' \
            > build/empty-game/export_presets.json
          ./build/release/tools/slash-cli/slash-cli export device --project build/empty-game
          ipa=$(ls build/empty-game/build/export/device/*.ipa)
          unzip -q "$ipa" -d build/ipa
          app=$(ls -d build/ipa/Payload/*.app)
          codesign --verify --strict --verbose=2 "$app"
          test "$(plutil -extract DTPlatformName raw "$app/Info.plist")" = "iphoneos"
          test "$(lipo -archs "$app/$(plutil -extract CFBundleExecutable raw "$app/Info.plist")")" = "arm64"

      - name: Check the minimum Windows version and sign with a preset
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/empty-game/build/export/windows/*.exe)[0].FullName
          $headers = dumpbin /headers $exe
          if (-not ($headers -match '10\.00 subsystem version')) { $headers; exit 1 }
          # The SDK's DLL ships beside the game.
          if (-not (dumpbin /dependents $exe | Select-String 'hello\.dll')) { exit 1 }
          if (-not (Test-Path build/empty-game/build/export/windows/hello.dll)) { exit 1 }
          # A throwaway certificate, exported the way a developer would hand one over.
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject 'CN=SlashEngine CI' `
            -CertStoreLocation Cert:\CurrentUser\My
          $password = ConvertTo-SecureString -String 'ci-only' -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath "$env:RUNNER_TEMP\ci.pfx" -Password $password
          $env:SLASH_WINDOWS_CERTIFICATE_PATH = "$env:RUNNER_TEMP\ci.pfx"
          $env:SLASH_WINDOWS_CERTIFICATE_PASSWORD = 'ci-only'
          Set-Content build/empty-game/export_presets.json `
            '{"format": 1, "presets": {"windows": {"platform": "windows", "windows": {"sign": true, "timestamp_url": ""}}}}'
          ./build/release/tools/slash-cli/slash-cli export windows --project build/empty-game
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $signature = Get-AuthenticodeSignature $exe
          if ($null -eq $signature.SignerCertificate) { $signature | Format-List; exit 1 }

      - name: Check the APK and sign it with a release key
        if: matrix.platform == 'android'
        run: |
          set -x
          cli=./build/release/tools/slash-cli/slash-cli
          apk=$(ls build/empty-game/build/export/android/*.apk)
          tools=$(ls -d "$ANDROID_HOME"/build-tools/*/ | grep -E '/[0-9.]+/$' | sort -V | tail -n 1)
          "$tools/zipalign" -c -P 16 4 "$apk" || { "$tools/zipalign" -c -v -P 16 4 "$apk"; exit 1; }
          badging=$("$tools/aapt2" dump badging "$apk")
          grep -Eq "(minSdkVersion|sdkVersion):'30'" <<< "$badging"
          grep -q "targetSdkVersion:'36'" <<< "$badging"
          grep -q "native-code:.*'arm64-v8a'" <<< "$badging"
          grep -q "native-code:.*'x86_64'" <<< "$badging"
          # The SDK's library is in each ABI, and its permission and meta-data in the manifest.
          unzip -l "$apk" | grep -q "lib/arm64-v8a/libhello.so"
          unzip -l "$apk" | grep -q "lib/x86_64/libhello.so"
          grep -q "uses-permission: name='android.permission.INTERNET'" <<< "$badging"
          # The example's library folder: its permission, and its string resource in the merged
          # manifest's <meta-data>.
          grep -q "uses-permission: name='android.permission.ACCESS_NETWORK_STATE'" <<< "$badging"
          "$tools/aapt2" dump resources "$apk" | grep -q "string/hello_sdk_version"
          # AndroidX: its classes dexed, its manifest merged with ${applicationId} filled in.
          unzip -p "$apk" 'classes*.dex' | grep -aq "Landroidx/core/app/NotificationCompat;"
          manifest=$("$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk")
          grep -q "androidx.core.app.CoreComponentFactory" <<< "$manifest"
          grep -Eq "\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION" <<< "$manifest"
          ! grep -q 'applicationId' <<< "$manifest"
          "$tools/apksigner" verify --min-sdk-version 30 "$apk"
          # A throwaway release keystore, passed the way a developer would.
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/release.jks" -storepass ci-only \
            -alias game -keypass ci-only -keyalg RSA -keysize 2048 -validity 1 \
            -dname "CN=SlashEngine CI"
          SLASH_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks" \
            SLASH_ANDROID_KEYSTORE_PASSWORD=ci-only SLASH_ANDROID_KEY_ALIAS=game \
            $cli export android --project build/empty-game
          "$tools/apksigner" verify --print-certs "$apk" | grep -q "CN=SlashEngine CI"

      - name: Enable KVM for the Android emulator
        if: matrix.platform == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the APK headless on an Android 11 emulator
        if: matrix.platform == 'android'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            ./build/release/tools/slash-cli/slash-cli export android --project build/empty-game --test > build/android-test.json
            cat build/android-test.json
            jq -e '.test.passed == true' build/android-test.json

      - name: Upload the export log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-log-${{ matrix.platform }}
          path: build/empty-game/.slash/export/*/export.log
          if-no-files-found: ignore

  # A Mac builds Windows and Linux games with the toolchains slash-cli downloads; the runners
  # for those platforms then run them.
  cross-export:
    name: Cross-export from macOS
    runs-on: macos-14
    env:
      HELLO_APP_ID: ci
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-macos-14-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/dependencies.json') }}

      - name: Cache downloaded toolchains
        uses: actions/cache@v4
        with:
          path: ~/.slash/toolchains
          key: toolchains-macos-14-${{ hashFiles('tools/exporter/src/toolchains.cpp') }}

      - name: Install tools
        run: brew install ninja

      - name: Build slash-cli
        run: |
          cmake --preset release
          cmake --build --preset release --target slash-cli

      - name: Export Windows, Linux and Linux arm64 games
        run: |
          cli=./build/release/tools/slash-cli/slash-cli
          $cli toolchain install
          $cli toolchain list
          $cli init build/empty-game
          $cli sdk add examples/sdk-package/sdks/hello --project build/empty-game
          cp .github/scripts/hello-sdk-check.cpp build/empty-game/src/
          echo '{"format": 1, "presets": {"linux-arm64": {"platform": "linux", "linux": {"arch": "arm64"}}}}' \
            > build/empty-game/export_presets.json
          for preset in windows linux linux-arm64; do
            if ! $cli export $preset --project build/empty-game --test > build/$preset.json; then
              cat build/$preset.json
              exit 1
            fi
            cat build/$preset.json
            jq -e '.test.skipped' build/$preset.json
          done
          # A tarball keeps the games' executable bits, which artifacts drop.
          tar -C build/empty-game/build/export -cf build/cross-exports.tar windows linux linux-arm64

      - uses: actions/upload-artifact@v4
        with:
          name: cross-exports
          path: build/cross-exports.tar

      - name: Upload the export logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: export-log-cross
          path: build/empty-game/.slash/export/*/export.log
          if-no-files-found: ignore

  cross-run:
    name: Run cross-exported games (${{ matrix.name }})
    needs: cross-export
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
          - name: Linux
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: cross-exports

      - name: Unpack the games
        shell: bash
        run: mkdir -p build/cross && tar -xf cross-exports.tar -C build/cross

      - name: Set up MSVC tools (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Check and run the Windows game
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem build/cross/windows/*.exe)[0].FullName
          $headers = dumpbin /headers $exe
          if (-not ($headers -match 'subsystem \(Windows GUI\)')) { $headers; exit 1 }
          # libc++, libunwind and winpthreads are linked in, so the game needs only Windows DLLs.
          $dependents = dumpbin /dependents $exe
          $dependents
          if ($dependents -match '(c\+\+|unwind|winpthread|gcc).*\.dll') { exit 1 }
          # Except the SDK package's, shipped beside it.
          if (-not ($dependents -match 'hello\.dll')) { exit 1 }
          # Start-Process waits for the game, which uses the GUI subsystem, and keeps its exit code.
          $out = "$env:RUNNER_TEMP\game-out.txt"
          $err = "$env:RUNNER_TEMP\game-err.txt"
          $game = Start-Process -FilePath $exe -ArgumentList '--headless', '--ticks', '60' `
            -WorkingDirectory (Split-Path $exe) -NoNewWindow -Wait -PassThru `
            -RedirectStandardOutput $out -RedirectStandardError $err
          Get-Content $err
          $output = Get-Content -Raw $out
          $output
          'exit code 0x{0:X8}' -f $game.ExitCode
          if ($game.ExitCode -ne 0 -or -not ($output -match '"ticks":60')) { $headers; exit 1 }

      - name: Set up QEMU for arm64 (Linux)
        if: runner.os == 'Linux'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Check and run the Linux games on Ubuntu 20.04
        if: runner.os == 'Linux'
        run: |
          .github/scripts/check-linux-game.sh build/cross/linux amd64
          .github/scripts/check-linux-game.sh build/cross/linux-arm64 arm64

  lint:
    name: Format and clang-tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Cache fetched dependencies
        uses: actions/cache@v4
        with:
          path: .cpm-cache
          key: cpm-lint-${{ hashFiles('cmake/Dependencies.cmake', 'cmake/dependencies.json') }}

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-format-18 clang-tidy-18 $LINUX_SDL_DEPS

      - name: Check formatting
        run: |
          find engine tools tests examples -name '*.cpp' -o -name '*.hpp' \
            | xargs clang-format-18 --dry-run --Werror

      - name: Configure for clang-tidy
        run: cmake --preset ci -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18

      - name: Generate headers
        run: cmake --build build/ci --target slash_api_hash

      - name: Check licenses
        run: ctest --preset ci -R licenses

      - name: Run clang-tidy
        # One clang-tidy per core: run one after another, the files take over half an hour.
        run: |
          find engine tools examples -name '*.cpp' \
            | xargs -P "$(nproc)" -n 8 clang-tidy-18 -p build/ci --quiet
